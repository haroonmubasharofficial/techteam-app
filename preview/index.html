<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tech Team Preview</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f6f4;color:#151515;font:14px system-ui,-apple-system,Segoe UI,sans-serif}.top{background:#fff;border-bottom:1px solid #ddd;padding:14px 20px;display:flex;gap:25px;align-items:center;position:sticky;top:0}.brand{font-weight:800;font-size:20px}.nav{display:flex;gap:18px;font-weight:650}.search{margin-left:auto;border:1px solid #ccc;border-radius:8px;padding:9px 12px;width:220px}.wrap{max-width:1200px;margin:auto;padding:25px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card,.panel{background:white;border:1px solid #ddd;border-radius:12px;padding:18px}.label{color:#777}.value{font-size:24px;font-weight:800;margin-top:8px}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.btn{border:0;border-radius:8px;padding:12px;font-weight:700;cursor:pointer}.green{background:#4a8f1c;color:#fff}.gray{background:#eee}.grid{display:grid;grid-template-columns:1fr 360px;gap:16px}.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field label{font-weight:700;display:block;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;border:1px solid #ccc;border-radius:7px;padding:9px}.table{overflow:auto}.table table{width:100%;min-width:1000px;border-collapse:collapse}.table th,.table td{border-top:1px solid #eee;padding:9px;text-align:left}.table input{width:100px;padding:7px;border:1px solid #ccc;border-radius:6px}.table .desc{width:240px}.totals div{display:flex;justify-content:space-between;padding:6px 0}.profit{font-size:19px;font-weight:800}.muted{color:#777}@media(max-width:850px){.nav{display:none}.cards{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}.form{grid-template-columns:1fr}.wrap{padding:15px}.search{width:150px}.actions{grid-template-columns:1fr 1fr}}</style></head><body><div class="top"><div class="brand">TECH TEAM</div><div class="nav"><span>Dashboard</span><span>Sales</span><span>Purchase</span><span>Stock</span><span>Parties</span><span>Reports</span></div><input id="search" class="search" placeholder="Search · Ctrl+K"></div><div class="wrap"><div style="display:flex;justify-content:space-between;align-items:end"><div><div class="muted">Sales</div><h1>New Quotation</h1></div><button class="btn green" onclick="window.print()">Save & Print</button></div><div class="panel"><div class="form"><div class="field"><label>Customer</label><select><option>Pak Kuwait Textiles Limited</option><option>ABC Technologies</option></select></div><div class="field"><label>Date</label><input type="date" id="date"></div><div class="field"><label>Reference</label><input value="PKTL - RWD - IT"></div><div class="field"><label>Summary</label><input value="Supply of Computer Hardware"></div></div></div><div class="panel" style="margin-top:16px"><div style="display:flex;justify-content:space-between"><h2>Items</h2><button class="btn green" onclick="addRow()">+ Add Item</button></div><div class="table"><table><thead><tr><th>#</th><th>Description</th><th>Qty</th><th>Purchase Cost</th><th>Delivery</th><th>Other</th><th>Selling Price</th><th>Discount</th><th>Tax %</th><th>Total</th></tr></thead><tbody id="rows"></tbody></table></div></div><div class="grid" style="margin-top:16px"><div class="panel"><h2>Terms & Conditions</h2><textarea rows="8">(1) The above mentioned prices are inclusive of applicable withholding tax.
(2) The above mentioned prices are non G.S.T.
(3) This quotation is valid for Seven (7) working days.
(4) Used / Imported hardware items are provided on Check Warranty basis.
(5) All items shall be delivered within Three (3) working days after issuance of Purchase Order.</textarea></div><div class="panel totals"><h2>Estimated Profit</h2><div><span>Total Cost</span><b id="cost">0.00</b></div><div><span>Selling Value</span><b id="selling">0.00</b></div><div><span>Tax</span><b id="tax">0.00</b></div><hr><div class="profit"><span>Customer Total</span><b id="grand">0.00</b></div><div class="profit" style="color:#4a8f1c"><span>Estimated Profit</span><b id="profit">0.00</b></div><div><span>Margin</span><b id="margin">0.00%</b></div></div></div></div><script>const money=n=>new Intl.NumberFormat('en-PK',{minimumFractionDigits:2,maximumFractionDigits:2}).format(n||0);function addRow(v={desc:'',q:1,pc:0,dc:0,oc:0,sp:0,disc:0,tax:0}){let i=document.querySelectorAll('#rows tr').length+1;let tr=document.createElement('tr');tr.innerHTML=`<td>${i}</td><td><input class="desc" value="${v.desc}"></td><td><input class="q" type="number" value="${v.q}"></td><td><input class="pc" type="number" value="${v.pc}"></td><td><input class="dc" type="number" value="${v.dc}"></td><td><input class="oc" type="number" value="${v.oc}"></td><td><input class="sp" type="number" value="${v.sp}"></td><td><input class="disc" type="number" value="${v.disc}"></td><td><input class="taxr" type="number" value="${v.tax}"></td><td class="line">0.00</td>`;document.querySelector('#rows').appendChild(tr);tr.querySelectorAll('input').forEach(x=>x.addEventListener('input',calc));calc()}function calc(){let cost=0,sell=0,tax=0;document.querySelectorAll('#rows tr').forEach(r=>{let q=+r.querySelector('.q').value||0,pc=+r.querySelector('.pc').value||0,dc=+r.querySelector('.dc').value||0,oc=+r.querySelector('.oc').value||0,sp=+r.querySelector('.sp').value||0,disc=+r.querySelector('.disc').value||0,tr=+r.querySelector('.taxr').value||0;c=(pc+dc+oc)*q;n=Math.max(0,sp*q-disc);t=n*tr/100;cost+=c;sell+=n;tax+=t;r.querySelector('.line').textContent=money(n+t)});let p=sell-cost;document.querySelector('#cost').textContent=money(cost);document.querySelector('#selling').textContent=money(sell);document.querySelector('#tax').textContent=money(tax);document.querySelector('#grand').textContent=money(sell+tax);document.querySelector('#profit').textContent=money(p);document.querySelector('#margin').textContent=(sell?p/sell*100:0).toFixed(2)+'%'}document.querySelector('#date').value=new Date().toISOString().slice(0,10);addRow({desc:'New Wi-Fi Router (Model: TP-Link Archer C20)',q:1,pc:7500,dc:0,oc:0,sp:9750,disc:0,tax:0});document.addEventListener('keydown',e=>{if(e.ctrlKey&&e.key.toLowerCase()==='k'){e.preventDefault();document.querySelector('#search').focus()}if(!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)&&e.key==='F2'){e.preventDefault();location.reload()}});</script></body></html>
